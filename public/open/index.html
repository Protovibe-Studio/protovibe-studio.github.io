<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <title>Open in Protovibe</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; }
      main { max-width: 28rem; padding: 2rem; text-align: center; }
      h1 { font-size: 1.5rem; }
      p { line-height: 1.6; }
      #open { display: inline-block; padding: .75rem 1.25rem; border: 1px solid currentColor; border-radius: .5rem; color: inherit; font-weight: 600; text-decoration: none; }
      #open[hidden] { display: none; }
      a:focus-visible { outline: 3px solid Highlight; outline-offset: 4px; }
    </style>
    <script src="./open.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Open in Protovibe</h1>
      <p id="status" role="status">Preparing your link…</p>
      <a id="open" target="protovibe-launch" hidden>Open in Protovibe</a>
      <iframe id="launcher" name="protovibe-launch" title="Open Protovibe" hidden></iframe>
      <noscript><p>Enable JavaScript to open this link in Protovibe.</p></noscript>
      <p><a href="/">Get Protovibe</a></p>
    </main>
  </body>
</html>
