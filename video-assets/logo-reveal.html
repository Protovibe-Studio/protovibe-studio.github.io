*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--ink)}body{font-family:system-ui,sans-serif;cursor:none}
#scene{position:absolute;inset:0;overflow:hidden;isolation:isolate;background:var(--ink)}
#atmosphere{position:absolute;inset:-15%;opacity:0;filter:blur(clamp(35px,6vw,120px));will-change:opacity,transform}
.cloud{position:absolute;border-radius:50%;mix-blend-mode:screen;will-change:transform;}
.blue{width:72%;height:85%;left:-8%;top:22%;background:radial-gradient(ellipse,var(--blue),transparent 68%)}
.violet{width:75%;height:90%;right:-10%;top:15%;background:radial-gradient(ellipse,var(--violet),transparent 68%)}
.rose{width:65%;height:60%;left:24%;top:42%;background:radial-gradient(ellipse,var(--rose),transparent 69%);opacity:.6}
#halo{position:absolute;inset:0;opacity:0;background:radial-gradient(ellipse 40% 28% at 50% 52%,#b5a2ff18,transparent 80%)}
.vignette{position:absolute;inset:0;background:radial-gradient(ellipse 70% 67% at 50% 48%,transparent 20%,#07070780 75%,var(--ink) 100%)}
#lockup{position:absolute;width: min(58vw,1000px);aspect-ratio:606/72;left:50%;top:50%;transform:translate(-50%,-50%);will-change:transform;}
.logo{position:absolute;inset:0;mask:var(--logo) center/contain no-repeat;-webkit-mask:var(--logo) center/contain no-repeat}
#body-light{background:linear-gradient(115deg,#f7f4ff,#ddd7ef 55%,#fdfaff);opacity:0;}
#spotlight{background:radial-gradient(ellipse 24% 230% at var(--beam,-30%) 45%,#fff 0%,#f4eaffed 18%,#d0b5ff55 48%,transparent 76%);opacity:0;filter:drop-shadow(0 0 12px #c9adff)}
#blackout{position:absolute;inset:0;background:var(--ink);opacity:0;pointer-events:none}
#controls{position:fixed;z-index:5;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:14px;align-items:center;padding:12px 18px;border:1px solid #ffffff22;border-radius:12px;background:#101015e8;color:#d5d0df;font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap}
body.controls{cursor:default}body.controls #controls{opacity:1;pointer-events:auto}button{font:inherit;color:inherit;background:#ffffff0c;border:1px solid #ffffff22;padding:7px 12px;border-radius:6px;cursor:pointer}button:hover{background:#ffffff20}#time{font-variant-numeric:tabular-nums;min-width:45px}input{width:160px;accent-color:#bda0fa}
@media(max-width:650px){#lockup{width:82vw}#controls{gap:7px;padding:9px;font-size:10px}input{width:60px}.hint{display:none}}
#tuning{position:fixed;right:0;bottom:0;z-index:10;padding:24px;width:350px;height:90px;cursor:default}#panel{position:absolute;right:16px;bottom:16px;width:320px;max-height:80vh;overflow:auto;padding:18px;background:#14121aef;border:1px solid #ffffff25;border-radius:12px;opacity:0;visibility:hidden;transition:opacity .2s;color:#ddd;font-size:12px}#tuning:hover #panel,#tuning:focus-within #panel{opacity:1;visibility:visible}#panel label{display:grid;grid-template-columns:1fr 130px;gap:8px;margin:12px 0}#panel input{width:130px}#panel summary{cursor:pointer;margin:14px 0;color:#bda0fa}#panel button{margin:5px}

</head>
<body>
<main id="scene" aria-label="Protovibe Studio animated logo">
<div id="atmosphere"><div class="cloud blue"></div><div class="cloud violet"></div><div class="cloud rose"></div></div><div id="halo"></div><div class="vignette"></div>
<div id="lockup" role="img" aria-label="Protovibe Studio"><div class="logo" id="body-light"></div><div class="logo" id="spotlight"></div></div><div id="blackout"></div>
</main>
<div id="controls"><button id="replay">Replay</button><button id="pause">Pause</button><button id="fullscreen">Fullscreen</button><input id="scrub" aria-label="Animation time" type="range" min="0" max="5" step="0.01" value="0"><span id="time">0.0s</span><span class="hint">R replay · Space pause · F fullscreen · H controls</span></div>
<aside id="tuning" aria-label="Animation settings"><div id="panel"><strong>Animation controls</strong><div id="settings"></div><button id="reset-settings">Reset</button><button id="panel-replay">Replay</button><p>Hover here to adjust. H shows playback controls.</p></div></aside><script>
'use strict';
// All times are seconds. No network requests, dependencies, or external assets.
const LOOP=false, DURATION=5;
const $=id=>document.getElementById(id), clouds=[...document.querySelectorAll('.cloud')];
const clamp=x=>Math.max(0,Math.min(1,x));
const ease=(a,b,t)=>{const x=clamp((t-a)/(b-a));return x*x*x*(x*(x*6-15)+10)};
let time=0,playing=true,last=null;
const params=new URLSearchParams(location.search);
if(params.has('t')){const requested=Number(params.get('t'));time=Number.isFinite(requested)?Math.max(0,Math.min(DURATION,requested)):0;playing=false}
const defaults={logoSize:100,atmosphereSize:100,spacing:0,tail:.25,speed:1,logoInStart:.12,logoInDuration:2.05,bgInStart:.12,bgInDuration:2.05,logoOutStart:3.65,logoOutDuration:1.1,bgOutStart:3.55,bgOutDuration:1.1,startX:0,startY:0,endX:96,endY:100,radius:2,endRadius:440,height:18,endHeight:3600,feather:95,warmth:70,brightness:85,drift:12,startSize:76,endSize:131};
const settings={...defaults};
const storageKey='protovibe-motion-settings-v1';
try{const saved=JSON.parse(localStorage.getItem(storageKey)||'{}');if(saved.logoInStart===undefined){saved.logoInDuration=saved.bgInDuration=saved.reveal;saved.bgOutStart=saved.fadeStart;saved.logoOutStart=typeof saved.fadeStart==='number'?saved.fadeStart+(saved.stagger||0):undefined;saved.logoOutDuration=saved.bgOutDuration=saved.fadeDuration;}for(const key of Object.keys(defaults)){if(typeof saved[key]==='number'&&Number.isFinite(saved[key]))settings[key]=saved[key]}}catch{}
function saveSettings(){try{localStorage.setItem(storageKey,JSON.stringify(settings))}catch{}}
function duration(){return Math.max(settings.logoInStart+settings.logoInDuration,settings.bgInStart+settings.bgInDuration,settings.logoOutStart+settings.logoOutDuration,settings.bgOutStart+settings.bgOutDuration)+settings.tail}

const groups={Composition:[['logoSize','Logo size %',20,180,1],['atmosphereSize','Atmosphere size %',20,200,1],['spacing','Initial light spacing %',-35,60,1]],Timing:[['tail','Dark tail seconds',0,2,.05],['speed','Playback speed',.25,2,.05]], 'Logo timing':[['logoInStart','Fade-in start (s)',0,8,.05],['logoInDuration','Fade-in duration (s)',.1,5,.05],['logoOutStart','Fade-out start (s)',0,10,.05],['logoOutDuration','Fade-out duration (s)',.1,5,.05]], 'Background timing':[['bgInStart','Fade-in start (s)',0,8,.05],['bgInDuration','Fade-in duration (s)',.1,5,.05],['bgOutStart','Fade-out start (s)',0,10,.05],['bgOutDuration','Fade-out duration (s)',.1,5,.05]],Spotlight:[['startX','Start X %',-20,100,1],['startY','Start Y %',-40,140,1],['endX','End X %',0,100,1],['endY','End Y %',0,100,1],['radius','Initial width %',1,30,1],['endRadius','Final width %',200,700,10],['height','Initial height %',5,150,1],['endHeight','Final height %',1000,6000,50],['feather','Feather %',50,100,1],['warmth','Initial intensity %',0,100,1]],Atmosphere:[['brightness','Brightness %',0,100,1],['drift','Inward travel %',0,30,1],['startSize','Start size %',10,200,1],['endSize','End size %',10,250,1]]};
for(const [name,fields] of Object.entries(groups)){const section=document.createElement('details');section.open=true;const title=document.createElement('summary');title.textContent=name;section.append(title);for(const [key,label,min,max,step] of fields){const row=document.createElement('label'),caption=document.createElement('span'),input=document.createElement('input');input.type='range';Object.assign(input,{min,max,step,value:settings[key]});const update=()=>caption.textContent=label+' · '+settings[key];update();input.oninput=()=>{settings[key]=Number(input.value);saveSettings();update();render(time)};input.dataset.key=key;row.append(caption,input);section.append(row)}$('settings').append(section)}
$('reset-settings').onclick=()=>{Object.assign(settings,defaults);document.querySelectorAll('#settings input').forEach(input=>{input.value=settings[input.dataset.key];input.oninput()})};
$('panel-replay').onclick=()=>replay();
function render(t){
 // A stationary egg-shaped light begins over P and expands with a widening feather.
 const expansion=ease(settings.logoInStart,settings.logoInStart+settings.logoInDuration,t);
 const lightsOut=1-ease(settings.bgOutStart,settings.bgOutStart+settings.bgOutDuration,t);
 // Both colors build slowly from the first reveal frame to full illumination.
 const lightProgress=clamp((t-settings.bgInStart)/settings.bgInDuration);
 const lightIn=(1-Math.cos(Math.PI*lightProgress))/2;
 const blue=lightIn*lightsOut;
 const violet=lightIn*lightsOut;
 const logoOut=1-ease(settings.logoOutStart,settings.logoOutStart+settings.logoOutDuration,t);
 $('atmosphere').style.opacity=settings.brightness/100;
 $('atmosphere').style.transform=`scale(${settings.atmosphereSize/100})`;
 clouds.forEach((el,i)=>{
  // The motion envelope spans the entire take, continuing through the fade.
  // Offset curves keep the two clouds from feeling mechanically synchronized.
  const travel=clamp(t/duration());
  const drift=(1-Math.cos(Math.PI*travel))/2;
  const growth=(1-Math.cos(Math.PI*Math.pow(travel,i===1?1.15:.9)))/2;
  const x=i===0?-settings.spacing+settings.drift*drift:i===1?settings.spacing-settings.drift*drift:2*Math.sin(travel*Math.PI);
  const y=-(i===0?5:3)*drift;
  const scale=(settings.startSize+(settings.endSize-settings.startSize)*growth)/100;
  const stretch=1+.06*Math.sin(travel*Math.PI*1.3+i*.7);
  const rotation=(i===0?7:-6)*drift;
  el.style.transform=`translate(${x}%,${y}%) rotate(${rotation}deg) scale(${scale*stretch},${scale/stretch})`;
  el.style.opacity=i===0?blue:i===1?violet:violet*.6;
 });
 $('halo').style.opacity=0;
 // Fixed over the P. The initial oval is taller than it is wide in screen
 // space; only its size and feather change, never its position.
 const center=settings.startX+(settings.endX-settings.startX)*expansion;
 const centerY=settings.startY+(settings.endY-settings.startY)*expansion;
 const radius=settings.radius+(settings.endRadius-settings.radius)*expansion;
 const height=settings.height+(settings.endHeight-settings.height)*expansion;
 const core=100-settings.feather;
 $('body-light').style.background=`radial-gradient(ellipse ${radius}% ${height}% at ${center}% ${centerY}%, #f1edf8 0%, #f1edf8 ${core}%, #f1edf8eb 25%, #f1edf8b8 45%, #f1edf866 65%, #f1edf81a 85%, #f1edf800 100%)`;
 // Global illumination warms from 70% to 100% across the full reveal.
 const warmth=settings.warmth/100+(1-settings.warmth/100)*ease(settings.logoInStart,settings.logoInStart+settings.logoInDuration,t);
 $('body-light').style.opacity=ease(settings.logoInStart,settings.logoInStart+settings.logoInDuration,t)*warmth*logoOut;
 $('spotlight').style.opacity=0;
 $('lockup').style.transform=`translate(-50%,-50%) scale(${settings.logoSize/100})`;
 $('blackout').style.opacity=0;
 $('scrub').max=duration();$('scrub').value=t;$('time').textContent=t.toFixed(1)+'s';
 $('pause').textContent=playing?'Pause':'Play';
}
function frame(now){if(last!==null&&playing){time+=(now-last)/1000*settings.speed;if(time>=duration()){if(LOOP)time%=duration();else{time=duration();playing=false}}}last=now;render(time);requestAnimationFrame(frame)}
function replay(){time=0;playing=true;last=null;render(time)}
function toggle(){playing=!playing;last=null;render(time)}
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(error){console.info('Use the browser fullscreen command.',error)}}
$('replay').onclick=replay;$('pause').onclick=toggle;$('fullscreen').onclick=fullscreen;
$('scrub').oninput=e=>{time=Number(e.target.value);playing=false;render(time)};
document.addEventListener('keydown',e=>{if(e.target.matches('input,button'))return;const k=e.key.toLowerCase();if(k==='r')replay();if(k===' '){e.preventDefault();toggle()}if(k==='f')fullscreen();if(k==='h')document.body.classList.toggle('controls')});
// Double-click anywhere to expose controls; they never appear automatically during a take.
document.addEventListener('dblclick',()=>document.body.classList.toggle('controls'));
// Deterministic frame access for inspection / capture.
window.motion={seek(t){time=Math.max(0,Math.min(duration(),Number(t)||0));playing=false;render(time)},replay,get duration(){return duration()}};
render(time);requestAnimationFrame(frame);
</script>
</body></html>
