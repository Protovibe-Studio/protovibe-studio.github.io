<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Claude — recording card</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070707;color:#f4f4f6;font-family:system-ui,sans-serif}body{cursor:none}main{height:100%;display:grid;place-items:center}#logo{width:var(--size,42vmin);height:var(--size,42vmin)}#logo svg{display:block;width:100%;height:100%}#hotspot{position:fixed;right:0;bottom:0;width:350px;height:110px;cursor:default}#panel{position:absolute;right:20px;bottom:20px;width:310px;padding:20px;background:#16141ded;border:1px solid #ffffff25;border-radius:12px;font-size:13px;opacity:0;visibility:hidden;transition:opacity .2s}#hotspot:hover #panel,#hotspot:focus-within #panel,body.controls #panel{opacity:1;visibility:visible}label{display:flex;justify-content:space-between;gap:12px}input{width:100%;margin:18px 0;accent-color:#baa2ec}button{background:#ffffff0d;border:1px solid #ffffff25;color:inherit;border-radius:6px;padding:8px 12px;cursor:pointer}p{font-size:11px;color:#aaa;margin-bottom:0}
</style></head><body><main><div id="logo" role="img" aria-label="Claude"><svg height="1em" style="flex:none;line-height:1" viewBox="0 0 24 24" width="1em" xmlns="http://www.w3.org/2000/svg"><title>Claude</title><path d="M4.709 15.955l4.72-2.647.08-.23-.08-.128H9.2l-.79-.048-2.698-.073-2.339-.097-2.266-.122-.571-.121L0 11.784l.055-.352.48-.321.686.06 1.52.103 2.278.158 1.652.097 2.449.255h.389l.055-.157-.134-.098-.103-.097-2.358-1.596-2.552-1.688-1.336-.972-.724-.491-.364-.462-.158-1.008.656-.722.881.06.225.061.893.686 1.908 1.476 2.491 1.833.365.304.145-.103.019-.073-.164-.274-1.355-2.446-1.446-2.49-.644-1.032-.17-.619a2.97 2.97 0 01-.104-.729L6.283.134 6.696 0l.996.134.42.364.62 1.414 1.002 2.229 1.555 3.03.456.898.243.832.091.255h.158V9.01l.128-1.706.237-2.095.23-2.695.08-.76.376-.91.747-.492.584.28.48.685-.067.444-.286 1.851-.559 2.903-.364 1.942h.212l.243-.242.985-1.306 1.652-2.064.73-.82.85-.904.547-.431h1.033l.76 1.129-.34 1.166-1.064 1.347-.881 1.142-1.264 1.7-.79 1.36.073.11.188-.02 2.856-.606 1.543-.28 1.841-.315.833.388.091.395-.328.807-1.969.486-2.309.462-3.439.813-.042.03.049.061 1.549.146.662.036h1.622l3.02.225.79.522.474.638-.079.485-1.215.62-1.64-.389-3.829-.91-1.312-.329h-.182v.11l1.093 1.068 2.006 1.81 2.509 2.33.127.578-.322.455-.34-.049-2.205-1.657-.851-.747-1.926-1.62h-.128v.17l.444.649 2.345 3.521.122 1.08-.17.353-.608.213-.668-.122-1.374-1.925-1.415-2.167-1.143-1.943-.14.08-.674 7.254-.316.37-.729.28-.607-.461-.322-.747.322-1.476.389-1.924.315-1.53.286-1.9.17-.632-.012-.042-.14.018-1.434 1.967-2.18 2.945-1.726 1.845-.414.164-.717-.37.067-.662.401-.589 2.388-3.036 1.44-1.882.93-1.086-.006-.158h-.055L4.132 18.56l-1.13.146-.487-.456.061-.746.231-.243 1.908-1.312-.006.006z" fill="#D97757" fill-rule="nonzero"></path></svg></div></main><aside id="hotspot" aria-label="Size controls"><div id="panel"><label for="size">Logo size <output id="value"></output></label><input id="size" type="range" min="10" max="90" step="1" value="42"><button id="fullscreen">Fullscreen</button> <button id="reset">Reset</button><p>F fullscreen · H controls · hover bottom-right</p></div></aside><script>
const slider=document.getElementById('size'),output=document.getElementById('value'),key='claude-recording-size';
try{const saved=Number(localStorage.getItem(key));if(saved>=10&&saved<=90)slider.value=saved}catch{}
function update(){document.documentElement.style.setProperty('--size',slider.value+'vmin');output.value=slider.value+'%';try{localStorage.setItem(key,slider.value)}catch{}}
slider.addEventListener('input',update);update();
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{}}
document.getElementById('fullscreen').onclick=fullscreen;document.getElementById('reset').onclick=()=>{slider.value=42;update()};
document.addEventListener('keydown',event=>{if(event.target.matches('input,button'))return;if(event.key.toLowerCase()==='f')fullscreen();if(event.key.toLowerCase()==='h')document.body.classList.toggle('controls')});
</script></body></html>
