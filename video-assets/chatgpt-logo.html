<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChatGPT — recording card</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070707;color:#f4f4f6;font-family:system-ui,sans-serif}body{cursor:none}main{height:100%;display:grid;place-items:center}#logo{width:var(--size,42vmin);height:var(--size,42vmin)}#logo svg{display:block;width:100%;height:100%}#hotspot{position:fixed;right:0;bottom:0;width:350px;height:110px;cursor:default}#panel{position:absolute;right:20px;bottom:20px;width:310px;padding:20px;background:#16141ded;border:1px solid #ffffff25;border-radius:12px;font-size:13px;opacity:0;visibility:hidden;transition:opacity .2s}#hotspot:hover #panel,#hotspot:focus-within #panel,body.controls #panel{opacity:1;visibility:visible}label{display:flex;justify-content:space-between;gap:12px}input{width:100%;margin:18px 0;accent-color:#baa2ec}button{background:#ffffff0d;border:1px solid #ffffff25;color:inherit;border-radius:6px;padding:8px 12px;cursor:pointer}p{font-size:11px;color:#aaa;margin-bottom:0}
</style></head><body><main><div id="logo" role="img" aria-label="ChatGPT"><svg fill="currentColor" fill-rule="evenodd" height="1em" style="flex:none;line-height:1" viewBox="0 0 24 24" width="1em" xmlns="http://www.w3.org/2000/svg"><title>OpenAI</title><path d="M9.205 8.658v-2.26c0-.19.072-.333.238-.428l4.543-2.616c.619-.357 1.356-.523 2.117-.523 2.854 0 4.662 2.212 4.662 4.566 0 .167 0 .357-.024.547l-4.71-2.759a.797.797 0 00-.856 0l-5.97 3.473zm10.609 8.8V12.06c0-.333-.143-.57-.429-.737l-5.97-3.473 1.95-1.118a.433.433 0 01.476 0l4.543 2.617c1.309.76 2.189 2.378 2.189 3.948 0 1.808-1.07 3.473-2.76 4.163zM7.802 12.703l-1.95-1.142c-.167-.095-.239-.238-.239-.428V5.899c0-2.545 1.95-4.472 4.591-4.472 1 0 1.927.333 2.712.928L8.23 5.067c-.285.166-.428.404-.428.737v6.898zM12 15.128l-2.795-1.57v-3.33L12 8.658l2.795 1.57v3.33L12 15.128zm1.796 7.23c-1 0-1.927-.332-2.712-.927l4.686-2.712c.285-.166.428-.404.428-.737v-6.898l1.974 1.142c.167.095.238.238.238.428v5.233c0 2.545-1.974 4.472-4.614 4.472zm-5.637-5.303l-4.544-2.617c-1.308-.761-2.188-2.378-2.188-3.948A4.482 4.482 0 014.21 6.327v5.423c0 .333.143.571.428.738l5.947 3.449-1.95 1.118a.432.432 0 01-.476 0zm-.262 3.9c-2.688 0-4.662-2.021-4.662-4.519 0-.19.024-.38.047-.57l4.686 2.71c.286.167.571.167.856 0l5.97-3.448v2.26c0 .19-.07.333-.237.428l-4.543 2.616c-.619.357-1.356.523-2.117.523zm5.899 2.83a5.947 5.947 0 005.827-4.756C22.287 18.339 24 15.84 24 13.296c0-1.665-.713-3.282-1.998-4.448.119-.5.19-.999.19-1.498 0-3.401-2.759-5.947-5.946-5.947-.642 0-1.26.095-1.88.31A5.962 5.962 0 0010.205 0a5.947 5.947 0 00-5.827 4.757C1.713 5.447 0 7.945 0 10.49c0 1.666.713 3.283 1.998 4.448-.119.5-.19 1-.19 1.499 0 3.401 2.759 5.946 5.946 5.946.642 0 1.26-.095 1.88-.309a5.96 5.96 0 004.162 1.713z"></path></svg></div></main><aside id="hotspot" aria-label="Size controls"><div id="panel"><label for="size">Logo size <output id="value"></output></label><input id="size" type="range" min="10" max="90" step="1" value="42"><button id="fullscreen">Fullscreen</button> <button id="reset">Reset</button><p>F fullscreen · H controls · hover bottom-right</p></div></aside><script>
const slider=document.getElementById('size'),output=document.getElementById('value'),key='chatgpt-recording-size';
try{const saved=Number(localStorage.getItem(key));if(saved>=10&&saved<=90)slider.value=saved}catch{}
function update(){document.documentElement.style.setProperty('--size',slider.value+'vmin');output.value=slider.value+'%';try{localStorage.setItem(key,slider.value)}catch{}}
slider.addEventListener('input',update);update();
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{}}
document.getElementById('fullscreen').onclick=fullscreen;document.getElementById('reset').onclick=()=>{slider.value=42;update()};
document.addEventListener('keydown',event=>{if(event.target.matches('input,button'))return;if(event.key.toLowerCase()==='f')fullscreen();if(event.key.toLowerCase()==='h')document.body.classList.toggle('controls')});
</script></body></html>
